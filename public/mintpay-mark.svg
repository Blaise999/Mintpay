<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Trust">
  <defs>
    <linearGradient id="mpGrad" x1="8" y1="8" x2="92" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="mpSheen" x1="20" y1="14" x2="60" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- coin tile -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#mpGrad)"/>
  <rect x="6" y="6" width="88" height="44" rx="24" fill="url(#mpSheen)"/>

  <!-- milled coin rim -->
  <rect x="15" y="15" width="70" height="70" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="1.5 5.5" stroke-linecap="round"/>

  <!-- M monogram -->
  <path d="M31 71 V37 L50 54 L69 37 V71" fill="none" stroke="#ffffff" stroke-width="9.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- upward pay chevron in the M's negative space -->
  <path d="M43 43 L50 33 L57 43" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
</svg>
